# This package holds all the configurations for
# the Modbus Solis interface

# Modbus configuration - used for periodic reading of registers
modbus:
  - name: "solis"
    type: tcp
    host: 192.168.0.201
    port: 502   # for S2-WL-ST sticks
    # port: 8899  # for DLS-L sticks

    sensors:
      - name: Solis Hour RW
        slave: 1
        address: 43003
        scale: 1
        input_type: holding
        data_type: uint16
        scan_interval: 60
        state_class: measurement
      - name: Solis Minute RW
        slave: 1
        address: 43004
        scale: 1
        input_type: holding
        data_type: uint16
        scan_interval: 60
        state_class: measurement
      - name: Solis Second RW
        slave: 1
        address: 43005
        scale: 1
        input_type: holding
        data_type: uint16
        scan_interval: 60
        state_class: measurement

      # Temperature
      - name: Solis Temperature
        unique_id: solis_temperature
        slave: 1
        address: 33093
        scale: 0.1
        input_type: input
        data_type: uint16
        scan_interval: 900
        device_class: temperature
        state_class: measurement
        unit_of_measurement: °C

      - name: Solis Alarm Code
        unique_id: solis_alarm_code
        slave: 1
        address: 33070
        scale: 1
        input_type: input
        data_type: uint16
        scan_interval: 60
        state_class: measurement

      - name: Solis Status
        unique_id: solis_status
        slave: 1
        address: 33095
        scale: 1
        input_type: input
        data_type: uint16
        scan_interval: 60
        state_class: measurement

      # block of 5 registers
      - name: Solis Fault Status
        unique_id: solis_fault_status
        slave: 1
        address: 33116
        scale: 1
        input_type: input
        data_type: uint16
        scan_interval: 60
        state_class: measurement
        virtual_count: 4

      - name: Solis Operating Status
        unique_id: solis_operating_status
        slave: 1
        address: 33121
        scale: 1
        input_type: input
        data_type: uint16
        scan_interval: 60
        state_class: measurement

      # block of 2 registers
      - name: Solis Battery Failure
        unique_id: solis_battery_failure
        slave: 1
        address: 33145
        scale: 1
        input_type: input
        data_type: uint16
        scan_interval: 60
        state_class: measurement
        virtual_count: 1

      # temp for sense checking controls
      - name: Solis Charge 1 Enable/Disable
        slave: 1
        address: 43815
        scale: 1
        input_type: holding
        data_type: uint16
        scan_interval: 60
        state_class: measurement

      - name: Solis Charge Current 1
        slave: 1
        address: 43709
        scale: 1
        input_type: holding
        data_type: uint16
        scan_interval: 60
        state_class: measurement

      - name: Solis Slot 1 Charge Start Hour
        slave: 1
        address: 43143
        scale: 1
        input_type: holding
        data_type: uint16
        scan_interval: 60
        state_class: measurement
      - name: Solis Slot 1 Charge Start Minute
        slave: 1
        address: 43144
        scale: 1
        input_type: holding
        data_type: uint16
        scan_interval: 60
        state_class: measurement
      - name: Solis Slot 1 Charge End Hour
        slave: 1
        address: 43145
        scale: 1
        input_type: holding
        data_type: uint16
        scan_interval: 60
        state_class: measurement
      - name: Solis Slot 1 Charge End Minute
        slave: 1
        address: 43146
        scale: 1
        input_type: holding
        data_type: uint16
        scan_interval: 60
        state_class: measurement

# inputs for primarily defining the overnight charge
input_datetime:
  charge_1_slot_start:
    name: Charge 1 Slot Start Time
    has_date: false
    has_time: true
    icon: mdi:clock-digital

  charge_1_slot_end:
    name: Charge 1 Slot End Time
    has_date: false
    has_time: true
    icon: mdi:clock-digital

input_number:
  charge_1_slot_current:
    name: Charge 1 Slot Current
    initial: 100
    mode: box
    unit_of_measurement: "AMPERE"
    min: 1
    max: 100
    step: 1
    icon: mdi:battery

input_boolean:
  charge_1_slot_enable:
    name: Charge 1 Slot Enable

# templates for decoding status/alert registers
# ref RS485_MODBUS-Hybrid-BACoghlan-201811228-1854.pdf
# and:
# https://github.com/Pho3niX90/solis_modbus/blob/master/custom_components/solis_modbus/data/status_mapping.py
template:
  - sensor:
    - unique_id: solis_status_string
      default_entity_id: sensor.solis_status_string
      name: "Solis Status"
      state: >
        {% set modbus_value = states('sensor.solis_status') | int(default=0) %}
        {% if modbus_value == 0 %}
          Normal
        {% elif modbus_value == 1 %}
          Open loop operation
        {% elif modbus_value == 2 %}
          Waiting
        {% elif modbus_value == 3 %}
          Generating
        {% elif modbus_value == 4 %}
          Bypass / Inverting / Running
        {% elif modbus_value == 5 %}
          Bypass / Inverting / Synchronize
        {% elif modbus_value == 6 %}
          Bypass / Grid / Running
        {% elif modbus_value == 7 %}
          Standby
        {% elif modbus_value == 8 %}
          Derating
        {% elif modbus_value == 10 %}
          Auto test
        {% elif modbus_value == 12 %}
          Parameter setting
        {% elif modbus_value == 13 %}
          Firmware updating
        {% elif modbus_value == 14 %}
          Timed charge
        {% elif modbus_value == 15 %}
          Generating
        {% elif modbus_value == 16 %}
          Timed discharge
        {% elif modbus_value == 0x1000 %}
          Stop
        {% elif modbus_value == 0x1004 %}
          Control off-Grid
        {% elif modbus_value == 0x100F %}
          Islanding fault
        {% elif modbus_value == 0x1010 %}
          Grid overvoltage
        {% elif modbus_value == 0x1011 %}
          Grid undervoltage
        {% elif modbus_value == 0x1012 %}
          Grid overfrequency
        {% elif modbus_value == 0x1013 %}
          Grid underfrequency
        {% elif modbus_value == 0x1014 %}
          Grid impedence too large
        {% elif modbus_value == 0x1015 %}
          No grid
        {% elif modbus_value == 0x1016 %}
          Grid imbalance
        {% elif modbus_value == 0x1017 %}
          Grid frequency jitter
        {% elif modbus_value == 0x1018 %}
          Grid overcurrent
        {% elif modbus_value == 0x1019 %}
          Grid current tracking fault
        {% elif modbus_value == 0x1020 %}
          DC overvoltage
        {% elif modbus_value == 0x1021 %}
          DC bus overvoltage
        {% elif modbus_value == 0x1022 %}
          DC busbar uneven voltage
        {% elif modbus_value == 0x1023 %}
          DC bus undervoltage
        {% elif modbus_value == 0x1024 %}
          DC busbar uneven voltage 2
        {% elif modbus_value == 0x1025 %}
          DC A way overcurrent
        {% elif modbus_value == 0x1026 %}
          DC B path overcurrent
        {% elif modbus_value == 0x1027 %}
          DC input disturbance
        {% elif modbus_value == 0x1028 %}
          DC reverse polarity
        {% elif modbus_value == 0x1029 %}
          PV midpoint grounding
        {% elif modbus_value == 0x1030 %}
          Grid disturbance
        {% elif modbus_value == 0x1031 %}
          DSP initialization malfunction protection
        {% elif modbus_value == 0x1032 %}
          Temperature protection
        {% elif modbus_value == 0x1033 %}
          Ground protection
        {% elif modbus_value == 0x1034 %}
          Leakage current fault
        {% elif modbus_value == 0x1035 %}
          Relay failure
        {% elif modbus_value == 0x1036 %}
          DSP_B failure protection
        {% elif modbus_value == 0x1037 %}
          DC component is too large
        {% elif modbus_value == 0x1038 %}
          12V undervoltage fault protection
        {% elif modbus_value == 0x1039 %}
          Leakage current self-test protection
        {% elif modbus_value == 0x103A %}
          Under temperature protection
        {% elif modbus_value == 0x1040 %}
          Arc self-test protection
        {% elif modbus_value == 0x1041 %}
          Arc malfunction protection
        {% elif modbus_value == 0x1042 %}
          DSP on-chip SRAM exception
        {% elif modbus_value == 0x1043 %}
          DSP on-chip FLASH exception
        {% elif modbus_value == 0x1044 %}
          DSP on-chip PC pointer is abnormal
        {% elif modbus_value == 0x1045 %}
          DSP key register exception
        {% elif modbus_value == 0x1046 %}
          Grid disturbance 02
        {% elif modbus_value == 0x1047 %}
          Grid current sampling abnormality
        {% elif modbus_value == 0x1048 %}
          IGBT overcurrent
        {% elif modbus_value == 0x1050 %}
          Network side current transient
        {% elif modbus_value == 0x1051 %}
          Battery overvoltage hardware failure
        {% elif modbus_value == 0x1052 %}
          LLC hardware overcurrent
        {% elif modbus_value == 0x1053 %}
          Battery overvoltage detection
        {% elif modbus_value == 0x1054 %}
          Battery undervoltage detection
        {% elif modbus_value == 0x1055 %}
          Battery not connected
        {% elif modbus_value == 0x1056 %}
          Bypass overvoltage fault
        {% elif modbus_value == 0x1057 %}
          Bypass overload fault
        {% elif modbus_value == 0x1058 %}
          DSP self-check error
        {% elif modbus_value == 0x1060 %}
          Battery force charging
        {% elif modbus_value == 0x1061 %}
          Battery force discharging
        {% elif modbus_value == 0x2010 %}
          Fail safe
        {% elif modbus_value == 0x2011 %}
          Meter communication failure
        {% elif modbus_value == 0x2012 %}
          Battery communication failure (BMS)
        {% elif modbus_value == 0x2013 %}
          BMS firmware updating
        {% elif modbus_value == 0x2014 %}
          DSP communication failure
        {% elif modbus_value == 0x2015 %}
          BMS alarm
        {% elif modbus_value == 0x2016 %}
          Battery name failure
        {% elif modbus_value == 0x2017 %}
          BMS alarm 2
        {% elif modbus_value == 0x2018 %}
          DRM connection failure
        {% elif modbus_value == 0x2019 %}
          Meter select failure
        {% elif modbus_value == 0x2020 %}
          Lead-acid battery high temperature
        {% elif modbus_value == 0x2021 %}
          Lead-acid battery low temperature
        {% elif modbus_value == 0x2047 %}
          Panel overcurrent
        {% elif modbus_value == 0x2048 %}
          Low battery
        {% elif modbus_value == 0x204A %}
          Inverter hard limit
        {% elif modbus_value == 0x204B %}
          G100 meter fault
        {% elif modbus_value == 0x204C %}
          G100 CT fault
        {% elif modbus_value == 0x2804 %}
          Battery wiring error 1
        {% elif modbus_value == 0x2805 %}
          Battery wiring error 2
        {% elif modbus_value == 0xF010 %}
          Grid surge
        {% elif modbus_value == 0xF011 %}
          Fan fault
        {% elif modbus_value == 0xF080 %}
          PV inverter communication failure
        {% elif modbus_value == 0xF081 %}
          Meter 2 failure
        {% elif modbus_value == 0xF082 %}
          Parallel version mismatch
        {% elif modbus_value == 0xF083 %}
          Load cut-off
        {% elif modbus_value == 0xF084 %}
          Load cut-off locked
        {% else %}
          unknown
        {% endif %}

  - sensor:
    - unique_id: solis_fault_status_string
      default_entity_id: sensor.solis_fault_status_string
      name: "Solis Fault Status"
      state: |
        {% set modbus_value = states('sensor.solis_fault_status') | int(default=0) %}
        {% set fault_status = [] %}
        {% if modbus_value is not none %}
          {% if bitwise_and(modbus_value,1) %}
            {% set fault_status = fault_status + ["No grid "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,2) %}
            {% set fault_status = fault_status + ["Grid overvoltage "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,4) %}
            {% set fault_status = fault_status + ["Grid undervoltage "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,8) %}
            {% set fault_status = fault_status + ["Grid overfrequency "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,16) %}
            {% set fault_status = fault_status + ["Grid underfrequency "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,32) %}
            {% set fault_status = fault_status + ["Grid imbalance "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,64) %}
            {% set fault_status = fault_status + ["Grid frequency jitter "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,128) %}
            {% set fault_status = fault_status + ["Grid impedance is too large "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,256) %}
            {% set fault_status = fault_status + ["Grid current tracking fault "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,512)  %}
            {% set fault_status = fault_status + ["METER communication failed "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,1024) %}
            {% set fault_status = fault_status + ["FailSafe"] %}
          {% endif %}
        {% endif %}
        {{ fault_status | join("") }}

  - sensor:
    - unique_id: solis_fault_status_1_string
      default_entity_id: sensor.solis_fault_status_1_string
      name: "Solis Fault Status 1"
      state: |
        {% set modbus_value = states('sensor.solis_fault_status_1') | int(default=0) %}
        {% set fault_status = [] %}
        {% if modbus_value is not none %}
          {% if bitwise_and(modbus_value,1) %}
            {% set fault_status = fault_status + ["Bypass overvoltage fault "] %}
          {% endif %}
          {% if bitwise_and(modbus_value,2) %}
            {% set fault_status = fault_status + ["Bypass overload fault"] %}
          {% endif %}
        {% endif %}
        {{ fault_status | join("") }}

  - sensor:
    - unique_id: solis_fault_status_2_string
      default_entity_id: sensor.solis_fault_status_2_string
      name: "Solis Fault Status 2"
      state: |
        {% set modbus_value = states('sensor.solis_fault_status_2') | int(default=0) %}
        {% set fault_status = [] %}
        {% if modbus_value is not none %}
          {% if bitwise_and(modbus_value,1) %}
            {% set fault_status = fault_status + ["Battery not connected  "] %}
